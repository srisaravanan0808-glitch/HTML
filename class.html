<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .card{
            width: 300px;
            background-color: rgb(53, 209, 185);
            border: 3px solid rgb(16, 1, 1);
            border-radius:20px;
            padding: 20px;
            margin: 30px;
        }
        body{
            background-color:bisque;
        }

        .card:hover{
            background-color:brown;
        }
        
    h1 {
        font-family: Arial;
        font-size: 35px;
        color: blue;
    }

    p {
        font-family: Verdana;
        font-size: 18px;
    }

    .btn {
        background-color: rgb(97, 97, 228);
        color: rgb(197, 30, 30);
        padding: 10px 20px;
        border: 2px solid black;
        border-radius: 8px;
        font-size: 16px;
    }

    .btn:hover{
        background-color:black;
        color:aquamarine
    }

    </style>
</head>

<body>
    <h1>css</h1>

    <div class="card">
        <h2>My Profile</h2>
        <p>I am learning Java Full Stack.</p>
    </div>

    <button class="btn">click me</button>

</body>
</html>
