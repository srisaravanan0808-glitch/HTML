<!DOCTYPE html>
<html>
<head>
    <style>
        .parent {
            position: relative;
            width: 300px;
            height: 200px;
            border: 2px solid black;
        }

        .box {
            position: absolute;
            top: 20px;
            right: 20px;
            left:20px;
            padding: 15px;
            border: 2px solid red;
        }
    </style>
</head>

<body>

    <div class="parent">
        <div class="box">ABSOLUTE</div>
    </div>

</body>
</html>
